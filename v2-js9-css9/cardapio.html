<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Cardápio completo da VH Burger.">
    <title>VH Burger - Cardápio</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="fundo-chef">

    <header>
        <a href="index.html" class="logo">...</a>

        <div class="header-actions">
            <button id="btn-tema" aria-label="Alternar tema"></button>
            <button id="btn-carrinho-header" aria-label="Abrir carrinho">
                🛒 <span class="badge" id="badge-carrinho-header" style="display:none;">0</span>
            </button>
        </div>

        <nav aria-label="Menu principal">...</nav>
    </header>

    <main>
        <!-- BANNER DO CARDÁPIO -->
        <section class="cardapio-hero">
            <h2>Explore Nossos Sabores</h2>
            <p>Temos opções para todos os gostos. Adicione ao carrinho e finalize em segundos.</p>
        </section>

        <!-- O GRID CONTINUA IGUAL (O JS PREENCHE) -->
        <section class="cardapio-container">
            <h2>Nosso Cardápio</h2>
            <div id="grid-cardapio" class="grid-produtos">
                <!-- Os cards são injetados pelo cardapio.ts -->
            </div>
        </section>
    </main>

    <footer>
        <p>🕐 Hora atual: <span id="relogio">--:--:--</span></p>
        <p><small>&copy; 2026 VH Burger. Todos os direitos reservados.</small></p>
    </footer>

    <script type="module" src="dist/main.js"></script>
    <script type="module" src="dist/carrinho.js"></script>
    <script type="module" src="dist/cardapio.js"></script>
</body>

</html>
